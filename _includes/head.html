<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="keywords" content="grupa gradjana Raša, grupa gradjana Rasa, obnova puta Raša, grupa gradjana, grupa građana, obnova puta">
  <meta name="description" content="Internet portal Grupa građana Raša.">


  <title>
    {% if page.title %}{{ page.title | escape }} - {{ site.title | escape }}
    {% else %}{{ site.title | escape }}{% endif %}
  </title>

  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <!-- Fontovi stoje kod nas (assets/fonts), ne na fonts.googleapis.com. Preload
       ide samo za dva reza koja se vide odmah; ostale @font-face pravila povuku
       tek ako zatrebaju. Ikonice su inline SVG sprite, vidi _includes/icons.svg. -->
  <link rel="preload" href="{{ "/assets/fonts/opensans-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/assets/fonts/lora-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{"/assets/main.css" | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

</head>
