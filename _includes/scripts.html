<!-- Service worker. Opseg je {{ "/" | relative_url }} jer sajt stoji u
     poddirektorijumu -- sw.js mora da bude u tom istom direktorijumu da bi
     smeo da ga kontrolise.

     Nova verzija ne preuzima sama od sebe (sw.js vise ne zove skipWaiting).
     Ceka, javi se trakom, i menja se tek na klik -- da se resursi ne bi
     zamenili nekome usred citanja. -->
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;

    var traka = document.getElementById('obavestenje-verzija');
    // Ako je stranica vec pod kontrolom, svaka nova verzija je nadogradnja.
    // Ako nije, ovo je prva instalacija -- tu nema sta da se osvezava.
    var bioKontrolor = !!navigator.serviceWorker.controller;
    var osvezava = false;

    function ponudi(radnik) {
      if (!traka || !radnik) return;
      // Nikad dve trake jedna preko druge; nadogradnja je preca.
      var ti = document.getElementById('obavestenje-instalacija');
      if (ti) ti.hidden = true;
      traka.hidden = false;
      document.getElementById('obavestenje-osvezi').onclick = function () {
        traka.hidden = true;
        radnik.postMessage('preuzmi-odmah');
      };
      document.getElementById('obavestenje-kasnije').onclick = function () {
        traka.hidden = true;
      };
    }

    // --- ponuda za instalaciju ---
    // Pregledac javi beforeinstallprompt samo ako je sajt stvarno instalabilan.
    // Hvatamo ga, gasimo podrazumevano ponasanje i cuvamo za nas dugme, da covek
    // ne mora da trazi stavku pod ⋮.
    var trakaInstal = document.getElementById('obavestenje-instalacija');
    var ponuda = null;
    var ODBIO = 'gg-rasa-ne-nudi-instalaciju';

    window.addEventListener('beforeinstallprompt', function (ev) {
      ev.preventDefault();
      ponuda = ev;
      try { if (localStorage.getItem(ODBIO)) return; } catch (err) {}
      if (!trakaInstal || (traka && !traka.hidden)) return;   // ne dve trake odjednom
      trakaInstal.hidden = false;
    });

    if (trakaInstal) {
      document.getElementById('obavestenje-instaliraj').onclick = function () {
        trakaInstal.hidden = true;
        if (!ponuda) return;
        ponuda.prompt();
        ponuda.userChoice.then(function () { ponuda = null; });
      };
      document.getElementById('obavestenje-ne-treba').onclick = function () {
        trakaInstal.hidden = true;
        try { localStorage.setItem(ODBIO, '1'); } catch (err) {}
      };
    }

    window.addEventListener('appinstalled', function () {
      if (trakaInstal) trakaInstal.hidden = true;
      ponuda = null;
    });

    // Kad nova verzija preuzme kontrolu, stranica se osvezava jednom.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!bioKontrolor || osvezava) return;
      osvezava = true;
      window.location.reload();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('{{ "/sw.js" | relative_url }}', { scope: '{{ "/" | relative_url }}' })
        .then(function (reg) {
          if (reg.waiting && bioKontrolor) ponudi(reg.waiting);

          reg.addEventListener('updatefound', function () {
            var novi = reg.installing;
            if (!novi) return;
            novi.addEventListener('statechange', function () {
              if (novi.state === 'installed' && bioKontrolor) ponudi(novi);
            });
          });

          // Kartica ume da stoji otvorena danima. Provera pri svakom povratku
          // na nju, da nadogradnja ne ceka sledecu navigaciju.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              reg.update().catch(function () {});
            }
          });
        })
        .catch(function (e) { console.warn('Service worker nije registrovan:', e); });
    });
  })();
</script>

{% if page.url contains 'contact' %}
  <!-- Form Validation -->
  <script src="{{ "/assets/vendor/startbootstrap-clean-blog/js/jqBootstrapValidation.js" | relative_url }}"></script>
  <!-- Send Form -->
  <script>
    $(function () {
      $("#contactForm input, #contactForm textarea").jqBootstrapValidation({
        preventSubmit: true,
        submitError: function ($form, event, errors) {
          // Additional error messages or events
        },
        submitSuccess: function ($form, event) {
          event.preventDefault(); // Prevent default submit behaviour

          // Get values from FORM
          var name = $("input#name").val();
          var email = $("input#email").val();
          var phone = $("input#phone").val();
          var message = $("textarea#message").val();
          var firstName = name;

          // Check for white space in name for Success/Fail message
          if (firstName.indexOf(" ") >= 0) {
            firstName = name.split(" ").slice(0, -1).join(" ");
          }

          $this = $("#sendMessageButton");
          $this.prop("disabled", true); // Disable submit button until AJAX call is complete

          $.ajax({
            url: "https://script.google.com/macros/s/AKfycbzWrx297ENpTOELDOlRRuSpFtrQlZakafg0g0e4Fy1Hvd6nqYLTNknwlu4tKa6zepk/exec",
            type: "POST",
            data: {
              to: "marko.milic@yahoo.com",
              subject: "Grupa građana Raša - Kontakt forma",
              name: name,
              phone: phone,
              email: email,
              message: message
            },
            dataType: "json",
            headers: { "Accept": "application/json" }, // Ensures Formspree responds with JSON
            success: function (response) {
              // Success message
              $("#success").html("<div class='alert alert-success'>");
              $("#success > .alert-success")
                .html("<button type='button' class='close' data-dismiss='alert' aria-hidden='true'>&times;</button>")
                .append("<strong>Your message has been sent successfully!</strong>")
                .append("</div>");

              // Clear all fields
              $("#contactForm").trigger("reset");
            },
            error: function (xhr) {
              // Fail message
              $("#success").html("<div class='alert alert-danger'>");
              $("#success > .alert-danger")
                .html("<button type='button' class='close' data-dismiss='alert' aria-hidden='true'>&times;</button>")
                .append("<strong>Sorry " + firstName + ", there was an issue sending your message.</strong>");

              if (xhr.responseJSON && xhr.responseJSON.errors) {
                $("#success > .alert-danger").append("<br>" + xhr.responseJSON.errors.map(e => e.message).join("<br>"));
              } else {
                $("#success > .alert-danger").append("<br>Please try again later.");
              }

              $("#success > .alert-danger").append("</div>");

              // Clear all fields
              $("#contactForm").trigger("reset");
            },
            complete: function () {
              setTimeout(function () {
                $this.prop("disabled", false); // Re-enable submit button
              }, 1000);
            }
          });
        },
        filter: function () {
          return $(this).is(":visible");
        }
      });

      $("a[data-toggle='tab']").click(function (e) {
        e.preventDefault();
        $(this).tab("show");
      });
    });

    /* When clicking on input, hide fail/success messages */
    $("#name").focus(function () {
      $("#success").html("");
    });
  </script>
{% endif %}
